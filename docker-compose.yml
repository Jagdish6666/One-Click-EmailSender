version: '3.8'

services:
  # =========================================================
  # Infrastructure
  # =========================================================
  mysql:
    image: mysql:8.0
    container_name: cert_mysql
    environment:
      MYSQL_ROOT_PASSWORD: super
      MYSQL_DATABASE: cert_sender_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psuper"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cert_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cert_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cert_network

  # =========================================================
  # Backend Microservices
  # =========================================================
  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: cert_api_gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
    networks:
      - cert_network

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: cert_auth_service
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=jdbc:mysql://mysql:3306/cert_sender_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DATABASE_USER=root
      - DATABASE_PASSWORD=super
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cert_network

  participant-service:
    build:
      context: ./backend/participant-service
    container_name: cert_participant_service
    ports:
      - "8083:8083"
    environment:
      - DATABASE_URL=jdbc:mysql://mysql:3306/cert_sender_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DATABASE_USER=root
      - DATABASE_PASSWORD=super
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cert_network

  certificate-service:
    build:
      context: ./backend/certificate-service
    container_name: cert_certificate_service
    ports:
      - "8084:8084"
    environment:
      - DATABASE_URL=jdbc:mysql://mysql:3306/cert_sender_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DATABASE_USER=root
      - DATABASE_PASSWORD=super
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - participant.service.url=http://participant-service:8083/api/participants
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cert_network

  notification-service:
    build:
      context: ./backend/notification-service
    container_name: cert_notification_service
    ports:
      - "8085:8085"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - participant.service.url=http://participant-service:8083/api/participants
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - cert_network

  # =========================================================
  # Frontend
  # =========================================================
  frontend:
    build:
      context: ./frontend
    container_name: cert_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - cert_network

volumes:
  mysql_data:

networks:
  cert_network:
    driver: bridge
