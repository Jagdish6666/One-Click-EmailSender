server.port=8082
spring.application.name=auth-service

# MySQL Database
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/cert_sender_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:eW91cl9zdXBlcl9zZWNyZXRfand0X2tleV90aGF0X2lzX2F0X2xlYXN0XzI1Nl9iaXRzX2xvbmdfZm9yX2htYWNfc2hhXzI1Ng==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002
