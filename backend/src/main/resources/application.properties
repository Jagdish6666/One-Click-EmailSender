server.port=${PORT:8081}

# MySQL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/certificate_sender?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:super}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Clerk JWT validation (only used when Clerk is configured)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URI:}

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

# Logging
logging.level.com.project.certificates=INFO

# SMTP (aligned with .env)
spring.mail.host=${EMAIL_HOST:localhost}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

# SendGrid (optional)
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${EMAIL_FROM:}

# File upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
